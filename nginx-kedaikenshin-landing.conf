server {
    listen 80;
    listen [::]:80;
    server_name kedaikenshin.com www.kedaikenshin.com;

    location /.well-known/acme-challenge/ {
        root /var/www/kedaikenshin.com/current;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kedaikenshin.com www.kedaikenshin.com;

    ssl_certificate /etc/letsencrypt/live/kedaikenshin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kedaikenshin.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/kedaikenshin.com/current;
    index index.html index.php;

    access_log /var/log/nginx/kedaikenshin-landing.access.log;
    error_log /var/log/nginx/kedaikenshin-landing.error.log;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
